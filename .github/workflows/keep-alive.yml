name: Keep Streamlit Cloud Alive

on:
  schedule:
    # 5分ごとにping
    - cron: "*/5 * * * *"
  workflow_dispatch: # 手動実行も可能

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake up Streamlit app
        run: |
          APP_URL="${{ secrets.STREAMLIT_APP_URL }}"
          if [ -z "$APP_URL" ]; then
            echo "::warning::STREAMLIT_APP_URL secret is not set."
            exit 0
          fi

          # リダイレクトを追従（-L）し、スリープ解除を待つ
          echo "Waking up: $APP_URL"
          # 1回目: リダイレクト追従でアプリを起動させる
          HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 60 "$APP_URL" || echo "000")
          echo "First request: HTTP $HTTP_CODE"

          # スリープからの起動には時間がかかるため、200以外なら待機してリトライ
          if [ "$HTTP_CODE" != "200" ]; then
            echo "App may be waking up, waiting 30 seconds..."
            sleep 30
            HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 60 "$APP_URL" || echo "000")
            echo "Second request: HTTP $HTTP_CODE"
          fi

          if [ "$HTTP_CODE" = "200" ]; then
            echo "App is alive"
          else
            echo "::warning::App returned HTTP $HTTP_CODE (may still be booting)"
          fi
