name: Keep Streamlit Cloud Alive

on:
  schedule:
    # 10分ごとにping（Streamlit Cloudは通常7日で寝るが、安全のため高頻度）
    - cron: "*/10 * * * *"
  workflow_dispatch: # 手動実行も可能

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Streamlit app
        run: |
          # アプリのURLにアクセスしてスリープを防止
          # STREAMLIT_APP_URL をリポジトリのSecretsに設定してください
          APP_URL="${{ secrets.STREAMLIT_APP_URL }}"
          if [ -z "$APP_URL" ]; then
            echo "::warning::STREAMLIT_APP_URL secret is not set. Skipping ping."
            exit 0
          fi
          echo "Pinging: $APP_URL"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$APP_URL" || echo "000")
          echo "Response: $HTTP_CODE"
          if [ "$HTTP_CODE" = "000" ]; then
            echo "::warning::App did not respond (timeout or network error)"
          elif [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "App is alive (HTTP $HTTP_CODE)"
          else
            echo "::warning::App returned HTTP $HTTP_CODE"
          fi
