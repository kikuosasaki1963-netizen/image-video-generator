name: Keep Streamlit Cloud Alive

on:
  schedule:
    # 3時間ごとに実行（スリープ防止）
    - cron: "0 */3 * * *"
  # コードプッシュ後にも実行（デプロイ後の起動を促進）
  push:
    branches: [main]
  # 手動実行も可能
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake up Streamlit app
        run: |
          APP_URL="https://video-creatorapp-idg69u.streamlit.app/"
          echo "Pinging $APP_URL ..."

          # 最大3回リトライ（デプロイ直後やスリープ復帰には時間がかかるため）
          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$APP_URL" 2>/dev/null) || HTTP_CODE="000"
            echo "Attempt $i: HTTP $HTTP_CODE"
            # 200/302/303 はすべて正常（Streamlit Cloudはリダイレクトで応答する）
            case "$HTTP_CODE" in
              200|301|302|303) echo "App is alive!"; exit 0 ;;
            esac
            echo "Waiting 60s before retry..."
            sleep 60
          done

          echo "::warning::App returned HTTP $HTTP_CODE after 3 attempts (may still be booting)"
          exit 0
