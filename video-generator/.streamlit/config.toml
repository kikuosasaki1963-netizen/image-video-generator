[server]
maxUploadSize = 200
# セッション切断までの猶予を最大化（秒）
enableWebsocketCompression = true
maxMessageSize = 500
# WebSocket pingで接続を維持（デフォルト20秒→短縮して切断を防止）
enableStaticServing = false

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#FF6B6B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"
